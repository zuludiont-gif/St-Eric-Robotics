name = "steric-robotics-media"
main = "worker.js"
compatibility_date = "2024-11-01"

# Binds this Worker to your R2 bucket under the name MEDIA_BUCKET,
# which is what worker.js refers to as env.MEDIA_BUCKET.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "steric-robotics-media"

